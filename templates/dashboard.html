<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TradeMind AI</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            padding:30px;
        }

        h1{
            color:#00ff99;
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid #444;
            padding:12px;
            text-align:center;
        }

        th{
            background:#222;
        }

        tr:nth-child(even){
            background:#1b1b1b;
        }

        tr:hover{
            background:#2a2a2a;
        }

        .buy{
            color:#00ff66;
            font-weight:bold;
        }

        .no{
            color:#ff4d4d;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>📈 TradeMind AI Scanner</h1>

<table>

    <tr>
        <th>Stock</th>
        <th>Price</th>
        <th>RSI</th>
        <th>MACD</th>
        <th>Signal</th>
    </tr>

    {% for row in results %}

    <tr>

        <td>{{ row.Stock }}</td>

        <td>₹ {{ row.Price }}</td>

        <td>{{ row.RSI }}</td>

        <td>{{ row.MACD }}</td>

        <td>

            {% if row.Signal == "BUY" %}

                <span class="buy">🟢 BUY</span>

            {% else %}

                <span class="no">🔴 NO BUY</span>

            {% endif %}

        </td>

    </tr>

    {% endfor %}

</table>

</body>

</html>
